<style>
:root{--navy:#292663;--coral:#E7634A;--bg:#f5f5fa;--card:#fff;--ink:#1f1d3d;--mute:#6d6b85;--line:#e6e5ef;--ok:#1f9d6b;--warn:#c98a00}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Arabic",Poppins,system-ui,sans-serif;font-size:15px}
.num{font-family:Poppins,"Noto Sans Arabic",sans-serif;font-variant-numeric:tabular-nums}
header{background:var(--navy);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
header img{height:34px;background:#fff;border-radius:8px;padding:3px 6px}
header .t{flex:1;min-width:0}
header .t b{display:block;font-size:16px}
header .t small{opacity:.8;font-size:12px}
header button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(41,38,99,.08);margin-bottom:14px}
h2{font-size:17px;margin:0 0 12px;color:var(--navy)}
input,select{font:inherit;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;color:var(--ink);width:100%}
input:focus,select:focus{outline:2px solid var(--coral);border-color:transparent}
.btn{background:var(--coral);color:#fff;border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer}
.btn.sec{background:var(--navy)}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
#login{max-width:360px;margin:12vh auto 0;text-align:center}
#login img{height:64px;margin-bottom:8px}
#login input{text-align:center;font-size:24px;letter-spacing:8px;font-family:Poppins}
#login .btn{width:100%;margin-top:12px}
.err{color:#c0392b;font-size:13px;min-height:20px;margin-top:8px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:#fff;border-radius:10px;padding:11px;font:inherit;font-weight:700;color:var(--mute);cursor:pointer;box-shadow:0 1px 3px rgba(41,38,99,.08)}
.tabs button.on{background:var(--navy);color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.row>*{flex:1;min-width:140px}
label.f{display:block;font-size:12px;color:var(--mute);margin-bottom:4px}
.items{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:720px){.items{grid-template-columns:1fr 1fr}}
.it{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px}
.it.has{border-color:var(--coral);background:#fff7f5}
.it img,.it .ph{width:56px;height:56px;object-fit:contain;border-radius:8px;flex:none;background:#f3f2f8}
.it .ph{display:grid;place-items:center;color:var(--mute);font-size:11px}
.it .info{flex:1;min-width:0}
.it .nm{font-size:13px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.it .pr{font-size:13px;margin-top:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.it s{color:var(--mute)}
.it .pp{color:var(--coral);font-weight:700}
.chip{font-size:11px;background:#eceaf7;color:var(--navy);border-radius:20px;padding:1px 8px}
.chip.z{background:#f1f1f1;color:#999}
.qty{display:flex;align-items:center;gap:4px;flex:none}
.qty button{width:34px;height:38px;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:20px;color:var(--navy);cursor:pointer}
.qty input{width:56px;text-align:center;padding:8px 2px;font-family:Poppins;font-weight:600}
.bar{position:sticky;bottom:0;background:var(--navy);color:#fff;padding:12px 16px;display:flex;gap:12px;align-items:center;border-radius:14px 14px 0 0;margin:0 -16px -16px;z-index:10}
.bar .s{flex:1;font-size:13px;line-height:1.5}
.bar .s b{font-size:17px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:720px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:#fff;border-radius:12px;padding:12px;box-shadow:0 1px 3px rgba(41,38,99,.08)}
.kpi small{color:var(--mute);font-size:12px;display:block}
.kpi b{font-size:22px;color:var(--navy);display:block;margin-top:4px}
.kpi em{font-style:normal;font-size:12px;color:var(--mute)}
.prog{height:12px;background:#ecebf4;border-radius:10px;overflow:hidden;position:relative;margin:8px 0 4px}
.prog i{display:block;height:100%;background:var(--coral);border-radius:10px}
.prog .m{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--navy)}
.note{font-size:13px;padding:10px 12px;border-radius:10px;margin-top:10px}
.note.ok{background:#e7f6ef;color:#14704b}
.note.w{background:#fff4dc;color:#7a5600}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right}
th{color:var(--mute);font-weight:500;font-size:12px;white-space:nowrap}
td.n,th.n{text-align:left}
.tw{overflow-x:auto}
tr.click{cursor:pointer}
tr.click:hover td{background:#faf9fe}
.hb{display:flex;align-items:center;gap:8px}
.hb span{display:block;height:10px;background:var(--navy);border-radius:6px;min-width:2px}
.badge{font-size:11px;border-radius:20px;padding:2px 8px;white-space:nowrap}
.badge.ok{background:#e7f6ef;color:#14704b}.badge.w{background:#fff4dc;color:#7a5600}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1f1d3d;color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;z-index:50;display:none}
.load{opacity:.55;pointer-events:none}
.muted{color:var(--mute);font-size:13px}
.hide{display:none!important}
</style>

const S = {pin:'', role:'', branch:'', meta:null, qty:{}, filter:'', tab:'entry', month:'', date:'', adminBranch:'', eb:''};

async function api(fn, body){
  const r = await fetch(API_URL,{method:'POST',body:JSON.stringify({fn,body}),headers:{'Content-Type':'text/plain;charset=utf-8'},credentials:'omit'});
  const j = await r.json();
  if(!j.ok) throw new Error(j.error);
  return j.data;
}
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f2 = x => (Math.round(x*100)/100).toLocaleString('en-US',{maximumFractionDigits:2});
const f0 = x => Math.round(x).toLocaleString('en-US');
const pc = x => Math.round(x*100) + '%';
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2500)}
const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const monthName = m => MONTHS[+m.slice(5,7)-1] + ' ' + m.slice(0,4);
function monthOpts(sel){
  let [y,m]=S.meta.today.slice(0,7).split('-').map(Number), out='';
  for(let i=0;i<12;i++){const v=y+'-'+String(m).padStart(2,'0');out+=`<option value="${v}" ${v===sel?'selected':''}>${monthName(v)}</option>`;if(--m===0){m=12;y--}}
  return out;
}

// ---------- install as app ----------
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
let deferredPrompt = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; $('#install')?.classList.remove('hide'); });
$('#install').onclick = async () => { if(!deferredPrompt) return; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; $('#install').classList.add('hide'); };
if(!standalone && /iphone|ipad|ipod/i.test(navigator.userAgent)) $('#ioshint').classList.remove('hide');

// ---------- login ----------
$('#go').onclick = login;
$('#pin').onkeydown = e => { if(e.key==='Enter') login(); };
try{ const p = localStorage.getItem('mk_pin'); if(p){ $('#pin').value=p; } }catch(e){}

async function login(){
  const pin = $('#pin').value.trim(); if(!pin) return;
  $('#login').classList.add('load'); $('#lerr').textContent='';
  try{
    const [who, meta] = await Promise.all([api('login',{pin}), api('init',{})]);
    Object.assign(S,{pin, role:who.role, branch:who.branch||'', meta, date:meta.today, month:meta.today.slice(0,7)});
    try{ localStorage.setItem('mk_pin',pin) }catch(e){}
    if(S.role==='admin'){ S.tab='report'; S.adminBranch=''; }
    shell();
  }catch(e){ $('#lerr').textContent = e.message; $('#login').classList.remove('load'); }
}
function logout(){ try{localStorage.removeItem('mk_pin')}catch(e){} location.reload(); }

function shell(){
  $('#app').innerHTML = `
  <header><img src="${LOGO}" alt=""><div class="t"><b>مبيعات مخازن العناية</b><small>${S.role==='admin'?'المدير — كل الفروع':'فرع '+esc(S.branch)}</small></div><button onclick="logout()">خروج</button></header>
  <main>
    <div class="tabs">
      <button data-t="entry">${S.role==='admin'?'إدخال لفرع':'إدخال مبيعات اليوم'}</button>
      <button data-t="report">${S.role==='admin'?'التقرير':'تقريري وعمولتي'}</button>
    </div>
    <div id="view"></div>
  </main>`;
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { S.tab=b.dataset.t; render(); });
  render();
}
function render(){
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.t===S.tab));
  S.tab==='entry' ? entry() : (S.role==='admin' && !S.adminBranch ? adminReport() : branchReport(S.role==='admin'?S.adminBranch:S.branch));
}

// ---------- entry ----------
async function entry(){
  const v = $('#view');
  const brSel = S.role==='admin' ? `<div><label class="f">الفرع</label><select id="ebr">${S.meta.branches.map(b=>`<option ${b===S.eb?'selected':''}>${esc(b)}</option>`).join('')}</select></div>` : '';
  v.innerHTML = `<div class="card">
    <div class="row">${brSel}
      <div><label class="f">التاريخ</label><input type="date" id="edate" value="${S.date}" max="${S.meta.today}"></div>
      <div><label class="f">بحث</label><input id="esearch" placeholder="اسم الصنف أو الباركود" value="${esc(S.filter)}"></div>
    </div>
    <p class="muted" id="estate" style="margin:10px 0 0">...</p>
  </div>
  <div class="card"><div class="items" id="elist"></div>
    <div class="bar"><div class="s" id="esum"></div><button class="btn" id="esave">حفظ</button></div>
  </div>`;
  if(S.role==='admin'){ if(!S.eb) S.eb=S.meta.branches[0]; $('#ebr').value=S.eb; $('#ebr').onchange=e=>{S.eb=e.target.value;loadDay()}; }
  $('#edate').onchange = e => { S.date = e.target.value; loadDay(); };
  $('#esearch').oninput = e => { S.filter = e.target.value; list(); };
  $('#esave').onclick = save;
  await loadDay();
}
async function loadDay(){
  $('#view').classList.add('load'); $('#estate').textContent='جاري التحميل...';
  try{
    const d = await api('getDay',{pin:S.pin, date:S.date, branch:S.eb});
    S.qty = d.qty;
    const n = Object.keys(d.qty).length;
    $('#estate').textContent = n ? `محفوظ لهذا اليوم ${n} صنف — تقدر تعدّل وتحفظ من جديد` : 'ما فيه مبيعات محفوظة لهذا اليوم — اكتب الكمية المباعة لكل صنف واضغط حفظ';
    list();
  }catch(e){ toast(e.message) }
  $('#view').classList.remove('load');
}
function list(){
  const q = S.filter.trim().toLowerCase();
  const items = S.meta.items.filter(x => !q || x.n.toLowerCase().includes(q) || x.b.includes(q));
  $('#elist').innerHTML = items.map(x => {
    const n = S.qty[x.b]||'';
    const img = IMG[x.b] ? `<img src="${IMG[x.b]}" alt="" loading="lazy">` : `<div class="ph">بدون صورة</div>`;
    return `<div class="it ${n?'has':''}" data-b="${x.b}">${img}
      <div class="info"><div class="nm">${esc(x.n)}</div>
        <div class="pr num">${x.d?`<s>${f2(x.rsp)}</s>`:''}<span class="pp">${f2(x.p)} ر.س</span>
        <span class="chip ${x.c?'':'z'}">${x.c?'عمولة '+f2(x.c)+' ر.س':'بدون عمولة'}</span></div></div>
      <div class="qty"><button data-d="1">+</button><input class="num" inputmode="numeric" value="${n}" placeholder="0"><button data-d="-1">−</button></div></div>`;
  }).join('') || '<p class="muted">ما فيه أصناف بهذا البحث</p>';
  document.querySelectorAll('#elist .it').forEach(el => {
    const b = el.dataset.b, inp = el.querySelector('input');
    const set = n => { n = Math.max(0, Math.floor(+n||0)); if(n) S.qty[b]=n; else delete S.qty[b]; inp.value = n||''; el.classList.toggle('has', !!n); sum(); };
    inp.oninput = () => set(inp.value.replace(/\D/g,''));
    el.querySelectorAll('button').forEach(bt => bt.onclick = () => set((S.qty[b]||0) + +bt.dataset.d));
  });
  sum();
}
function sum(){
  let p=0,v=0,c=0; const by={}; S.meta.items.forEach(x=>by[x.b]=x);
  for(const b in S.qty){ const x=by[b]; if(!x) continue; p+=S.qty[b]; v+=S.qty[b]*x.p; c+=S.qty[b]*x.c; }
  $('#esum').innerHTML = `<b class="num">${f0(p)}</b> حبة · <span class="num">${f2(v)}</span> ر.س<br>عمولة اليوم <span class="num">${f2(c)}</span> ر.س`;
}
async function save(){
  const btn = $('#esave'); btn.disabled = true; btn.textContent='جاري الحفظ...';
  try{
    const r = await api('saveDay',{pin:S.pin, date:S.date, branch:S.eb, qty:S.qty});
    toast(r.saved ? `تم الحفظ ✓ ${r.pieces} حبة` : 'تم الحفظ ✓ (بدون مبيعات لهذا اليوم)');
    $('#estate').textContent = r.saved ? `محفوظ لهذا اليوم ${r.saved} صنف — تقدر تعدّل وتحفظ من جديد` : 'ما فيه مبيعات محفوظة لهذا اليوم';
  }catch(e){ toast(e.message) }
  btn.disabled = false; btn.textContent='حفظ';
}

// ---------- reports ----------
function monthBar(extra){
  return `<div class="card"><div class="row">${extra||''}<div><label class="f">الشهر</label><select id="rmonth">${monthOpts(S.month)}</select></div></div></div>`;
}
function bindMonth(fn){ $('#rmonth').onchange = e => { S.month = e.target.value; fn(); }; }

async function branchReport(branch){
  const v = $('#view');
  const back = S.role==='admin' ? `<div style="flex:0"><label class="f">&nbsp;</label><button class="btn ghost" id="back">← كل الفروع</button></div>` : '';
  v.innerHTML = monthBar(back) + '<div id="rb"><p class="muted">جاري التحميل...</p></div>';
  if(back) $('#back').onclick = () => { S.adminBranch=''; render(); };
  bindMonth(() => branchReport(branch));
  try{
    const r = await api('report',{pin:S.pin, month:S.month});
    const o = r.branches[branch];
    const need = Math.ceil(r.target*r.thr);
    const days = Object.keys(o.days).sort().reverse();
    const items = Object.entries(o.items).sort((a,b)=>b[1].qty-a[1].qty);
    $('#rb').innerHTML = `
    <div class="kpis">
      <div class="kpi"><small>المباع هذا الشهر</small><b class="num">${f0(o.pieces)}</b><em>من تارجت <span class="num">${f0(r.target)}</span> حبة</em></div>
      <div class="kpi"><small>نسبة التارجت</small><b class="num">${pc(o.pct)}</b><em>${o.full?'حققتي 80% ✓':'باقي <span class="num">'+f0(need-o.pieces)+'</span> حبة لـ 80%'}</em></div>
      <div class="kpi"><small>العمولة المستحقة</small><b class="num">${f2(o.final)}</b><em>ريال ${o.full?'(كاملة)':'(نص العمولة)'}</em></div>
      <div class="kpi"><small>قيمة المبيعات</small><b class="num">${f2(o.value)}</b><em>ريال بعد العرض</em></div>
    </div>
    <div class="card" style="margin-top:14px">
      <div class="prog"><i style="width:${Math.min(100,o.pct*100)}%"></i><span class="m" style="right:${r.thr*100}%"></span></div>
      <div class="muted num" style="display:flex;justify-content:space-between"><span>0</span><span>80% = ${f0(need)}</span><span>${f0(r.target)}</span></div>
      ${o.full ? `<div class="note ok">حققتي ${pc(o.pct)} من التارجت — العمولة كاملة <b class="num">${f2(o.raw)}</b> ريال.</div>`
               : `<div class="note w">العمولة كاملة <b class="num">${f2(o.raw)}</b> ريال، لكن الفرع ما وصل 80% من التارجت فتنصرف النص: <b class="num">${f2(o.final)}</b> ريال. إذا وصلتي <b class="num">${f0(need)}</b> حبة تاخذين العمولة كاملة.</div>`}
    </div>
    <div class="card"><h2>المبيعات اليومية</h2>${days.length?`<div class="tw"><table><tr><th>اليوم</th><th class="n">حبات</th><th class="n">القيمة</th><th class="n">العمولة</th></tr>
      ${days.map(d=>`<tr><td class="num">${d}</td><td class="n num">${f0(o.days[d].pieces)}</td><td class="n num">${f2(o.days[d].value)}</td><td class="n num">${f2(o.days[d].comm)}</td></tr>`).join('')}</table></div>`:'<p class="muted">ما فيه مبيعات هذا الشهر</p>'}</div>
    <div class="card"><h2>الأصناف</h2>${items.length?`<div class="tw"><table><tr><th>الصنف</th><th class="n">حبات</th><th class="n">القيمة</th><th class="n">العمولة</th></tr>
      ${items.map(([b,x])=>`<tr><td>${esc(x.n)}</td><td class="n num">${f0(x.qty)}</td><td class="n num">${f2(x.value)}</td><td class="n num">${f2(x.comm)}</td></tr>`).join('')}</table></div>`:'<p class="muted">—</p>'}</div>`;
  }catch(e){ $('#rb').innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}

let LAST = null;
async function adminReport(){
  const v = $('#view');
  v.innerHTML = monthBar(`<div style="flex:0"><label class="f">&nbsp;</label><button class="btn sec" id="xl">تحميل Excel</button></div>`) + '<div id="rb"><p class="muted">جاري التحميل...</p></div>';
  bindMonth(adminReport);
  $('#xl').onclick = () => LAST && excel(LAST);
  try{
    const r = LAST = await api('report',{pin:S.pin, month:S.month});
    const B = Object.entries(r.branches);
    const T = B.reduce((t,[,o])=>({pieces:t.pieces+o.pieces,value:t.value+o.value,raw:t.raw+o.raw,final:t.final+o.final}),{pieces:0,value:0,raw:0,final:0});
    const max = Math.max(1,...B.map(([,o])=>o.pieces));
    const all = {};
    B.forEach(([,o]) => Object.entries(o.items).forEach(([b,x]) => { const a = all[b] || (all[b]={n:x.n,qty:0,value:0}); a.qty+=x.qty; a.value+=x.value; }));
    const top = Object.values(all).sort((a,b)=>b.qty-a.qty).slice(0,15);
    const days = [...new Set(B.flatMap(([,o])=>Object.keys(o.days)))].sort().reverse();
    $('#rb').innerHTML = `
    <div class="kpis">
      <div class="kpi"><small>إجمالي الحبات</small><b class="num">${f0(T.pieces)}</b><em>${B.length} فروع</em></div>
      <div class="kpi"><small>قيمة المبيعات</small><b class="num">${f2(T.value)}</b><em>ريال بعد العرض</em></div>
      <div class="kpi"><small>العمولات المستحقة</small><b class="num">${f2(T.final)}</b><em>من أصل <span class="num">${f2(T.raw)}</span></em></div>
      <div class="kpi"><small>التارجت لكل فرع</small><b class="num">${f0(r.target)}</b><em>العمولة كاملة من ${pc(r.thr)}</em></div>
    </div>
    <div class="card" style="margin-top:14px"><h2>مقارنة الفروع — ${monthName(r.month)}</h2><div class="tw"><table>
      <tr><th>الفرع</th><th>الحبات</th><th class="n">التارجت</th><th class="n">القيمة</th><th class="n">العمولة كاملة</th><th class="n">المستحقة</th></tr>
      ${B.sort((a,b)=>b[1].pieces-a[1].pieces).map(([n,o])=>`<tr class="click" data-b="${esc(n)}"><td><b>${esc(n)}</b></td>
        <td><div class="hb"><span style="width:${o.pieces/max*90}px"></span><b class="num">${f0(o.pieces)}</b></div></td>
        <td class="n"><span class="badge ${o.full?'ok':'w'} num">${pc(o.pct)}</span></td>
        <td class="n num">${f2(o.value)}</td><td class="n num">${f2(o.raw)}</td><td class="n num"><b>${f2(o.final)}</b></td></tr>`).join('')}
    </table></div><p class="muted">اضغط على الفرع لتفاصيله</p></div>
    <div class="card"><h2>أكثر الأصناف مبيعًا</h2>${top.length?`<div class="tw"><table><tr><th>الصنف</th><th class="n">حبات</th><th class="n">القيمة</th></tr>
      ${top.map(x=>`<tr><td>${esc(x.n)}</td><td class="n num">${f0(x.qty)}</td><td class="n num">${f2(x.value)}</td></tr>`).join('')}</table></div>`:'<p class="muted">ما فيه مبيعات هذا الشهر</p>'}</div>
    <div class="card"><h2>الحبات يوميًا لكل فرع</h2>${days.length?`<div class="tw"><table><tr><th>اليوم</th>${B.map(([n])=>`<th class="n">${esc(n)}</th>`).join('')}<th class="n">المجموع</th></tr>
      ${days.map(d=>`<tr><td class="num">${d}</td>${B.map(([,o])=>`<td class="n num">${o.days[d]?f0(o.days[d].pieces):'—'}</td>`).join('')}<td class="n num"><b>${f0(B.reduce((s,[,o])=>s+(o.days[d]?o.days[d].pieces:0),0))}</b></td></tr>`).join('')}</table></div>`:'<p class="muted">—</p>'}</div>`;
    document.querySelectorAll('tr.click').forEach(tr => tr.onclick = () => { S.adminBranch = tr.dataset.b; render(); });
  }catch(e){ $('#rb').innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}

function excel(r){
  const wb = XLSX.utils.book_new();
  const B = Object.entries(r.branches);
  const sum = [['الفرع','الحبات','التارجت','نسبة التارجت','قيمة المبيعات','العمولة كاملة','العمولة المستحقة','الحالة']];
  B.forEach(([n,o]) => sum.push([n,o.pieces,r.target,Math.round(o.pct*1000)/10+'%',o.value,o.raw,o.final,o.full?'كاملة':'نص العمولة']));
  add(wb, sum, 'ملخص الفروع');
  const it = [['الفرع','الباركود','الصنف','الحبات','القيمة','العمولة']];
  B.forEach(([n,o]) => Object.entries(o.items).sort((a,b)=>b[1].qty-a[1].qty).forEach(([b,x]) => it.push([n,b,x.n,x.qty,Math.round(x.value*100)/100,Math.round(x.comm*100)/100])));
  add(wb, it, 'الأصناف');
  const dy = [['التاريخ','الفرع','الحبات','القيمة','العمولة']];
  B.forEach(([n,o]) => Object.keys(o.days).sort().forEach(d => dy.push([d,n,o.days[d].pieces,Math.round(o.days[d].value*100)/100,Math.round(o.days[d].comm*100)/100])));
  add(wb, dy, 'يومي');
  XLSX.writeFile(wb, `مبيعات مخازن العناية ${r.month}.xlsx`);
}
function add(wb, aoa, name){
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = aoa[0].map((h,i)=>({wch: Math.max(10, ...aoa.map(r=>String(r[i]??'').length).slice(0,200))+2}));
  ws['!views'] = [{RTL:true}];
  XLSX.utils.book_append_sheet(wb, ws, name);
}
</script>
